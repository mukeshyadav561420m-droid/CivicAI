services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civicai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: civicai_user
      POSTGRES_PASSWORD: civicai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
